<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:opsz,wght@12..96,500;12..96,700;12..96,800&family=IBM+Plex+Mono:wght@500&family=IBM+Plex+Sans+Arabic:wght@400;500;600&family=IBM+Plex+Sans:wght@400;500;600&family=Lalezar&display=swap" rel="stylesheet">
<style>
/* Layout: one working column (max 1080px). Home hero splits pitch | live sample idea card and stacks under 820px.
   Visual idea: cool writing paper, ink-blue, and a highlighter stripe that marks the hook. */
:root{
  --hl:#FFE14D; --hl-ink:#141C45;
  --paper:#F1F3F8; --surface:#FFFFFF; --sunk:#E8EBF3; --ink:#141C45; --muted:#596187; --line:#D6DBE8;
  --brand:#2B3BD6; --brand-ink:#FFFFFF; --mark:#FFE14D; --ok:#1C7F54; --warn:#B4441F;
  --shadow:0 1px 0 rgba(20,28,69,.04), 0 14px 34px -16px rgba(20,28,69,.22);
  --f-display:"Bricolage Grotesque","Lalezar",ui-sans-serif,system-ui,sans-serif;
  --f-body:"IBM Plex Sans","IBM Plex Sans Arabic",system-ui,-apple-system,"Segoe UI",Tahoma,sans-serif;
  --f-mono:"IBM Plex Mono",ui-monospace,SFMono-Regular,Menlo,monospace;
}
@media (prefers-color-scheme: dark){
  :root:not([data-theme="light"]){
    --paper:#0C1130; --surface:#151C44; --sunk:#10163A; --ink:#ECEFFA; --muted:#A2A9CA; --line:#2A3367;
    --brand:#8D9BFF; --brand-ink:#0C1130; --mark:#6A5714; --ok:#5BD39E; --warn:#FF9B78;
    --shadow:0 1px 0 rgba(0,0,0,.2), 0 16px 40px -18px rgba(0,0,0,.6);
    color-scheme:dark;
  }
}
:root[data-theme="dark"]{
  --paper:#0C1130; --surface:#151C44; --sunk:#10163A; --ink:#ECEFFA; --muted:#A2A9CA; --line:#2A3367;
  --brand:#8D9BFF; --brand-ink:#0C1130; --mark:#6A5714; --ok:#5BD39E; --warn:#FF9B78;
  --shadow:0 1px 0 rgba(0,0,0,.2), 0 16px 40px -18px rgba(0,0,0,.6);
  color-scheme:dark;
}
[lang="ar"]{
  --f-display:"Lalezar","Bricolage Grotesque",system-ui,sans-serif;
  --f-body:"IBM Plex Sans Arabic","IBM Plex Sans",system-ui,Tahoma,sans-serif;
}

*{box-sizing:border-box}
body{background:var(--paper);color:var(--ink);font-family:var(--f-body);font-size:16px;line-height:1.55;-webkit-font-smoothing:antialiased}
button,input,textarea{font:inherit;color:inherit}
.disp{font-family:var(--f-display);font-weight:800;letter-spacing:-.02em;line-height:1.08;text-wrap:balance}
[lang="ar"] .disp,.disp:lang(ar){font-weight:400;letter-spacing:0;line-height:1.35}
.wrap{max-width:1080px;margin:0 auto;padding-inline:16px}
:focus-visible{outline:3px solid var(--brand);outline-offset:2px;border-radius:6px}

/* top bar */
.bar{position:sticky;top:env(safe-area-inset-top,0px);z-index:5;background:color-mix(in srgb,var(--paper) 88%,transparent);backdrop-filter:blur(8px);border-bottom:1px solid var(--line)}
.bar .wrap{display:flex;align-items:center;gap:12px;padding-block:12px}
.logo{display:flex;align-items:center;gap:2px;font-family:"Bricolage Grotesque",system-ui,sans-serif;font-weight:800;font-size:1.3rem;letter-spacing:-.03em;background:none;border:0;padding:0;cursor:pointer;direction:ltr}
.logo b{background:var(--mark);padding:0 .28em;border-radius:4px;transform:rotate(-3deg);display:inline-block;margin-inline-start:2px}
.bar nav{margin-inline-start:auto;display:flex;gap:6px;flex-wrap:wrap}
.navbtn{border:1px solid transparent;background:none;border-radius:999px;padding:6px 12px;font-size:.92rem;font-weight:500;cursor:pointer;color:var(--muted)}
.navbtn:hover{color:var(--ink);background:var(--sunk)}
.navbtn[aria-current="true"]{color:var(--ink);border-color:var(--line);background:var(--surface)}
.navbtn .n{font-family:var(--f-mono);font-size:.78rem;margin-inline-start:4px}
.langbtn{border:1px solid var(--line);background:var(--surface);color:var(--ink)}

main{padding-block:32px 72px}
.view{display:grid;gap:40px}

/* buttons */
.btn{display:inline-flex;align-items:center;justify-content:center;gap:8px;border-radius:10px;padding:12px 20px;font-weight:600;cursor:pointer;border:1px solid transparent;line-height:1.2;transition:transform .12s ease,background .12s ease}
.btn:active{transform:translateY(1px)}
.btn-primary{background:var(--brand);color:var(--brand-ink)}
.btn-primary:hover{filter:brightness(1.08)}
.btn-ghost{background:transparent;border-color:var(--line);color:var(--ink)}
.btn-ghost:hover{background:var(--surface)}
.btn-sm{padding:7px 12px;font-size:.88rem;border-radius:8px;font-weight:500}
.row{display:flex;flex-wrap:wrap;gap:10px;align-items:center}

/* hero */
.hero{display:grid;grid-template-columns:1.05fr .95fr;gap:48px;align-items:center}
.hero-text{display:grid;gap:18px;min-width:0}
.eyebrow{font-family:var(--f-mono);font-size:.78rem;text-transform:uppercase;letter-spacing:.1em;color:var(--muted);margin:0}
[lang="ar"] .eyebrow{font-family:var(--f-body);letter-spacing:0;font-size:.9rem;font-weight:600}
.hero h1{font-size:clamp(2.2rem,5.4vw,3.9rem);margin:0}
mark{background:linear-gradient(transparent 52%,var(--mark) 52%,var(--mark) 92%,transparent 92%);color:inherit;padding:0 .08em}
.lede{font-size:1.12rem;color:var(--muted);max-width:34em;margin:0}
.ticks{list-style:none;padding:0;margin:4px 0 0;display:flex;flex-wrap:wrap;gap:8px 18px;font-size:.92rem;color:var(--muted)}
.ticks li::before{content:"✓";color:var(--ok);font-weight:700;margin-inline-end:6px}
.hero-card{min-width:0;display:grid;gap:10px}
.hero-card .idea{transform:rotate(1.2deg)}
[dir="rtl"] .hero-card .idea{transform:rotate(-1.2deg)}
.tiny{font-family:var(--f-mono);font-size:.74rem;text-transform:uppercase;letter-spacing:.1em;color:var(--muted);margin:0}
[lang="ar"] .tiny,.tiny:lang(ar){font-family:var(--f-body);letter-spacing:0;font-size:.82rem;font-weight:600}

/* how */
.how h2,.section-head h2{font-size:clamp(1.5rem,3vw,2rem);margin:0}
.steps{list-style:none;padding:0;margin:18px 0 0;display:grid;grid-template-columns:repeat(3,1fr);gap:16px;counter-reset:s}
.steps li{counter-increment:s;border-top:2px solid var(--ink);padding-top:14px;display:grid;gap:6px;min-width:0}
.steps li::before{content:counter(s);font-family:var(--f-mono);font-size:.8rem;color:var(--muted)}
.steps b{font-size:1.06rem}
.steps span{color:var(--muted);font-size:.95rem}

/* panels */
.panel{background:var(--surface);border:1px solid var(--line);border-radius:16px;padding:28px;box-shadow:var(--shadow);max-width:720px;width:100%;margin-inline:auto;display:grid;gap:20px}
.section-head{display:grid;gap:6px}
.section-head p{margin:0;color:var(--muted)}
.field{display:grid;gap:6px}
.field label{font-weight:600;font-size:.95rem}
.field input{border:1px solid var(--line);background:var(--paper);border-radius:10px;padding:12px 14px;width:100%}
.field input:focus{outline:none;border-color:var(--brand);box-shadow:0 0 0 3px color-mix(in srgb,var(--brand) 25%,transparent)}
.field small{color:var(--muted)}
.seg{display:flex;flex-wrap:wrap;gap:8px}
.seg input{position:absolute;opacity:0;pointer-events:none}
.seg label{border:1px solid var(--line);border-radius:999px;padding:8px 14px;cursor:pointer;font-weight:500;font-size:.92rem;background:var(--paper)}
.seg input:checked+label{background:var(--ink);color:var(--paper);border-color:var(--ink)}
.seg input:focus-visible+label{outline:3px solid var(--brand);outline-offset:2px}
.err{color:var(--warn);font-size:.92rem;margin:0;min-height:1.4em}

/* session */
.progress{display:flex;align-items:center;gap:10px}
.dots{display:flex;gap:6px}
.dots i{width:28px;height:6px;border-radius:3px;background:var(--line);display:block}
.dots i.on{background:var(--brand)}
.dots i.done{background:var(--ink)}
.q-angle{display:inline-flex;align-self:start;justify-self:start}
.q{font-size:clamp(1.5rem,3.4vw,2.2rem);margin:0}
.hint{color:var(--muted);margin:0}
.ruled{width:100%;min-height:9.5rem;resize:vertical;border:1px solid var(--line);border-radius:12px;padding:6px 16px;font-size:1.1rem;line-height:2.25rem;background-color:var(--paper);
  background-image:repeating-linear-gradient(to bottom,transparent 0,transparent calc(2.25rem - 1px),var(--line) calc(2.25rem - 1px),var(--line) 2.25rem);
  background-position:0 6px;background-attachment:local}
.ruled:focus{outline:none;border-color:var(--brand);box-shadow:0 0 0 3px color-mix(in srgb,var(--brand) 25%,transparent)}
.meter{display:flex;flex-wrap:wrap;gap:8px;align-items:center}
.meter .tiny{margin-inline-end:4px}
.pill{font-size:.82rem;border:1px solid var(--line);border-radius:999px;padding:3px 10px;color:var(--muted);background:var(--paper)}
.pill.on{border-color:var(--ok);color:var(--ok);background:color-mix(in srgb,var(--ok) 10%,var(--surface))}
.pill.on::before{content:"✓ "}
.session-actions{display:flex;flex-wrap:wrap;gap:10px;justify-content:space-between}

/* idea card */
.chip{font-family:var(--f-mono);font-size:.72rem;text-transform:uppercase;letter-spacing:.09em;background:var(--ink);color:var(--paper);border-radius:6px;padding:4px 8px;line-height:1.2}
.chip:lang(ar){font-family:var(--f-body);letter-spacing:0;font-size:.8rem;font-weight:600}
.ideas{display:grid;gap:24px;max-width:780px;width:100%;margin-inline:auto}
.idea{background:var(--surface);border:1px solid var(--line);border-radius:16px;box-shadow:var(--shadow);padding:22px;display:grid;gap:16px;min-width:0;font-family:var(--f-body)}
.idea-head{display:flex;flex-wrap:wrap;gap:8px 12px;align-items:center}
.from{color:var(--muted);font-size:.86rem;min-width:0;overflow-wrap:anywhere}
.idea-title{font-size:1.45rem;margin:0;overflow-wrap:anywhere}
.idea-title:lang(ar){font-family:"Lalezar",var(--f-display);font-weight:400;letter-spacing:0;line-height:1.4}
.sec-label{display:flex;justify-content:space-between;gap:10px;align-items:baseline}
.sec-label .tiny:last-child{text-transform:none;letter-spacing:0}
.hooks{list-style:none;margin:6px 0 0;padding:0;display:grid;gap:8px}
.hooks li{display:grid;grid-template-columns:1.6rem 1fr auto;gap:8px;align-items:start;padding:10px 12px;border-radius:10px;background:var(--paper)}
.hooks li .k{font-family:var(--f-mono);font-size:.78rem;color:var(--muted);padding-top:.2em}
.hooks li .h{font-weight:500;min-width:0;overflow-wrap:anywhere}
.hooks li:first-child .h > span:first-child{background:linear-gradient(transparent 55%,var(--mark) 55%,var(--mark) 95%,transparent 95%);box-decoration-break:clone;-webkit-box-decoration-break:clone}
.hooks li .wc{display:block;font-family:var(--f-mono);font-size:.72rem;color:var(--muted);margin-top:4px;font-weight:500}
.hooks li .wc.long{color:var(--warn)}
.icon-btn{border:1px solid var(--line);background:var(--surface);border-radius:8px;padding:5px 9px;font-size:.8rem;cursor:pointer;color:var(--muted)}
.icon-btn:hover{color:var(--ink);border-color:var(--ink)}
.tabs{display:flex;gap:4px;background:var(--sunk);padding:4px;border-radius:10px;flex-wrap:wrap}
.tab{flex:1 1 auto;border:0;background:transparent;border-radius:7px;padding:7px 10px;font-size:.88rem;font-weight:500;cursor:pointer;color:var(--muted);white-space:nowrap}
.tab[aria-selected="true"]{background:var(--surface);color:var(--ink);box-shadow:0 1px 2px rgba(0,0,0,.12)}
.outline{list-style:none;margin:0;padding:0;display:grid}
.outline li{display:grid;grid-template-columns:5.2rem 1fr;gap:12px;padding:9px 0;border-bottom:1px dashed var(--line)}
.outline li:last-child{border-bottom:0}
.outline .t{font-family:var(--f-mono);font-size:.76rem;color:var(--brand);padding-top:.25em;font-variant-numeric:tabular-nums}
.outline .t:lang(ar){font-family:var(--f-body);font-size:.84rem;font-weight:600}
.outline .b{min-width:0;overflow-wrap:anywhere}
.idea-actions{display:flex;flex-wrap:wrap;gap:8px;border-top:1px solid var(--line);padding-top:14px}
.idea-actions .saved{color:var(--ok);border-color:var(--ok)}
.results-head{display:flex;flex-wrap:wrap;gap:16px;justify-content:space-between;align-items:end;max-width:780px;width:100%;margin-inline:auto}
.empty{max-width:560px;margin:24px auto;text-align:center;color:var(--muted);display:grid;gap:16px;justify-items:center}
.empty .disp{color:var(--ink);font-size:1.6rem;margin:0}

footer.foot{border-top:1px solid var(--line);color:var(--muted);font-size:.86rem}
footer.foot .wrap{padding-block:18px;display:flex;flex-wrap:wrap;gap:8px 20px;justify-content:space-between}

.toast{position:fixed;inset-inline:0;bottom:0;padding-bottom:calc(18px + env(safe-area-inset-bottom,0px));display:flex;justify-content:center;pointer-events:none;z-index:20}
.toast span{background:var(--ink);color:var(--paper);padding:10px 16px;border-radius:999px;font-size:.92rem;font-weight:500;box-shadow:var(--shadow);transform:translateY(12px);opacity:0;transition:all .2s ease}
.toast.show span{transform:none;opacity:1}

/* unlock */
.navbtn.unlockbtn{background:var(--hl);color:var(--hl-ink);font-weight:600}
.navbtn.unlockbtn:hover{background:var(--hl);filter:brightness(.96)}
.fine{margin:0;font-size:.9rem;color:var(--muted)}
.btn-lg{padding:14px 26px;font-size:1.05rem}
.btn-hl{background:var(--hl);color:var(--hl-ink)}
.banner{max-width:780px;width:100%;margin-inline:auto;display:flex;flex-wrap:wrap;gap:14px;align-items:center;justify-content:space-between;background:var(--ink);color:var(--paper);border-radius:16px;padding:18px 22px}
.banner div{display:grid;gap:2px;min-width:0}
.banner span{opacity:.8}
.unlock{display:grid;grid-template-columns:1.1fr .9fr;gap:48px;align-items:start}
.unlock-pitch{display:grid;gap:18px;min-width:0}
.unlock-pitch h2{font-size:clamp(2rem,4.6vw,3.2rem);margin:0}
.price{display:flex;flex-wrap:wrap;align-items:baseline;gap:12px}
.price .amount{font-size:clamp(3rem,7vw,4.4rem);line-height:1}
.perks{list-style:none;margin:0;padding:0;display:grid;gap:10px}
.perks li{display:flex;gap:10px}
.perks li::before{content:"✓";color:var(--ok);font-weight:700}
.unlock-side{margin:0;max-width:none}
.side-title{font-size:1.5rem;margin:0}
.small{font-size:.88rem}
.keyline{margin:0;display:flex;gap:8px;align-items:baseline}
.keyline code{font-family:var(--f-mono);font-size:.95rem}
@media (max-width:820px){
  .unlock{grid-template-columns:1fr;gap:28px}
  .hero{grid-template-columns:1fr;gap:28px}
  .hero-card .idea,[dir="rtl"] .hero-card .idea{transform:none}
  .steps{grid-template-columns:1fr}
  .panel{padding:20px}
}
@media (max-width:480px){
  .outline li{grid-template-columns:1fr;gap:2px}
  .idea{padding:16px}
  .hooks li{grid-template-columns:1.2rem 1fr}
  .hooks li .icon-btn{grid-column:2;justify-self:start}
}
@media (prefers-reduced-motion:reduce){*{transition:none!important}}
</style>

/* ---------- helpers ---------- */
const esc = s => String(s).replace(/[&<>"']/g, c => ({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c]));
const shuffle = a => { a = a.slice(); for(let i=a.length-1;i>0;i--){ const j=Math.floor(Math.random()*(i+1)); [a[i],a[j]]=[a[j],a[i]]; } return a; };
const words = s => s.trim().split(/\s+/).filter(Boolean).length;
const uid = () => Date.now().toString(36)+Math.random().toString(36).slice(2,7);
const AR_DIGITS = "٠١٢٣٤٥٦٧٨٩";
const localNum = (n, lang) => lang==="ar" ? String(n).replace(/\d/g, d => AR_DIGITS[d]) : String(n);

function cleanAnswer(s){
  return s.trim().replace(/\s+/g," ").replace(/^["“”«»']+|["“”«»']+$/g,"").trim();
}
function shortAnswer(s){
  let first = cleanAnswer(s).split(/(?<=[.!?؟])\s/)[0];
  first = first.replace(/[.!。]+$/,"");
  const w = first.split(" ");
  if(w.length > 18) first = w.slice(0,18).join(" ")+"…";
  return first;
}
function fill(tpl, ctx, lang){
  let out = tpl.replace(/\{(a|full|aud|res|niche)\}/g, (_,k) => ctx[k] || "");
  out = out.replace(/([?!.…؟])\./g,"$1").replace(/([?؟])”\s/g,"$1” ").replace(/\s+/g," ").trim();
  if(lang==="en") out = out.charAt(0).toUpperCase()+out.slice(1);
  return out;
}
function profileCtx(p){ return {aud:p.aud.trim(), res:p.res.trim(), niche:p.niche.trim()}; }
function questionText(id, lang, p){
  const A = ANGLES[id][lang];
  return fill(A.q, profileCtx(p || EXAMPLE[lang]), lang);
}

function makeIdea(angle, answer, profile, lang, fixed){
  const A = ANGLES[angle][lang];
  const ctx = Object.assign(profileCtx(profile), {a:shortAnswer(answer), full:cleanAnswer(answer)});
  const angleHooks = A.hooks.map(h => fill(h, ctx, lang));
  const uniHooks = UNIVERSAL[lang].map(h => fill(h, ctx, lang));
  const ctas = CTAS[lang].map(c => fill(c, ctx, lang));
  const idea = {
    id:uid(), lang, angle, answer:cleanAnswer(answer),
    title:fill(A.title, ctx, lang),
    beats:A.spine.map(b => fill(b, ctx, lang)),
    angleHooks, uniHooks, ctas,
    tab:(profile.plat || "short"), created:Date.now()
  };
  pickHooks(idea, fixed);
  return idea;
}
function pickHooks(idea, fixed){
  if(fixed){ idea.hooks=[idea.angleHooks[0], idea.angleHooks[1], idea.uniHooks[0]]; idea.cta=idea.ctas[1]; return; }
  const prev = idea.hooks || [];
  let a = shuffle(idea.angleHooks), u = shuffle(idea.uniHooks);
  // prefer hooks not shown last time
  a.sort((x,y) => prev.includes(x) - prev.includes(y));
  u.sort((x,y) => prev.includes(x) - prev.includes(y));
  idea.hooks = [a[0], a[1], u[0]];
  idea.cta = shuffle(idea.ctas)[0];
}
function outlineRows(it, tab){
  const L = T[it.lang];
  const first = tab==="youtube" ? it.hooks[0]+" "+L.promise : it.hooks[0];
  const items = [first].concat(it.beats, [it.cta]);
  return L.times[tab].map((t,i) => [t, items[i]]);
}
function ideaText(it){
  const L = T[it.lang];
  const lines = [it.title, L.angle+": "+ANGLES[it.angle][it.lang].name, "", L.hooks+":"];
  it.hooks.forEach((h,i) => lines.push((i+1)+". "+h));
  lines.push("", L.fmt[it.tab]+":");
  outlineRows(it, it.tab).forEach(r => lines.push(r[0]+" · "+r[1]));
  return lines.join("\n");
}

  return state.results.find(x => x.id===id) || state.vault.find(x => x.id===id);
}

/* ---------- access: free round, then license key ---------- */
const DEMO = CONFIG.licenseApi === "demo";
const storeReady = DEMO || /^https:\/\//.test(CONFIG.licenseApi);
const isUnlocked = () => !!(state.license && state.license.key);
const canStartRound = () => isUnlocked() || (+state.rounds || 0) < CONFIG.freeRounds;
const price = s => s.replace(/\{price\}/g, CONFIG.price);
// The price is wrapped so "$9" keeps its order inside Arabic sentences.
const priceHTML = s => esc(s).replace(/\{price\}/g, `<bdi dir="ltr">${esc(CONFIG.price)}</bdi>`);

function licenseCall(action, payload){
  if(DEMO){
    return new Promise(r => setTimeout(() => r(/^DEMO-/i.test(payload.key||"") ? {ok:true, instance:"demo", email:""} : {ok:false, error:"invalid_key"}), 500));
  }
  if(!storeReady) return Promise.resolve({ok:false, error:"not_set"});
  return fetch(CONFIG.licenseApi.replace(/\/+$/,"")+"/"+action, {
    method:"POST", headers:{"Content-Type":"application/json"}, body:JSON.stringify(payload)
  }).then(r => r.json()).catch(() => ({ok:false, error:"network"}));
}
function deviceName(){
  const ua = navigator.userAgent || "";
  const os = /iPhone|iPad/.test(ua) ? "iOS" : /Android/.test(ua) ? "Android" : /Mac/.test(ua) ? "Mac" : /Win/.test(ua) ? "Windows" : "Device";
  return "UnblockU · "+os+" · "+new Date().toISOString().slice(0,10);
}
function activateKey(key){
  key = key.trim();
  if(!key){ state.err = L().errors.missing_key; render("f-key"); return; }
  state.busy = true; state.err = ""; render();
  licenseCall("activate", {key, device:deviceName()}).then(res => {
    state.busy = false;
    if(res && res.ok){
      state.license = {key, instance:res.instance || null, email:res.email || "", checked:Date.now()};
      store.set("license", state.license);
      toast(L().unlockedToast);
      state.profile ? newSession() : go("profile","f-niche");
    } else {
      state.err = L().errors[(res && res.error) || "invalid_key"] || L().errors.invalid_key;
      state.keyDraft = key; render("f-key");
    }
  });
}
function removeLicense(){
  const lic = state.license;
  if(lic && !DEMO) licenseCall("deactivate", {key:lic.key, instance:lic.instance});
  state.license = null; store.set("license", null);
  toast(L().removedDevice); render();
}
// Re-check a stored key about once a week, so refunded keys stop working. Offline keeps access.
function recheckLicense(){
  const lic = state.license;
  if(!lic || DEMO || !storeReady) return;
  if(Date.now() - (lic.checked || 0) < 7*24*3600*1000) return;
  licenseCall("validate", {key:lic.key, instance:lic.instance}).then(res => {
    if(res && res.ok){ lic.checked = Date.now(); store.set("license", lic); }
    else if(res && ["invalid_key","disabled","wrong_product"].includes(res.error)){ state.license = null; store.set("license", null); render(); }
  });
}

/* ---------- views ---------- */
function L(){ return T[state.lang]; }

function renderNav(){
  const l = L(), v = state.view;

    `<button class="navbtn" data-action="vault" aria-current="${v==="vault"}">${l.navVault}<span class="n">${localNum(state.vault.length, state.lang)}</span></button>`+
    (isUnlocked() ? "" : `<button class="navbtn unlockbtn" data-action="unlock" aria-current="${v==="unlock"}">${l.navUnlock}</button>`)+
    (state.profile ? `<button class="navbtn" data-action="profile" aria-current="${v==="profile"}">${l.navProfile}</button>` : "")+

}

function cardHTML(it, opts){
  opts = opts || {};
  const l = T[it.lang], A = ANGLES[it.angle][it.lang];
  const hooks = it.hooks.map((h,i) => {
    const n = words(h);
    return `<li><span class="k">${localNum(i+1,it.lang)}</span><div class="h"><span>${esc(h)}</span><span class="wc ${n>15?"long":""}">${l.words.replace("{n}", localNum(n,it.lang))}</span></div>`+
      `<button class="icon-btn" data-action="copy-hook" data-id="${it.id}" data-k="${i}">${l.copy}</button></li>`;
  }).join("");
  const tabs = ["short","youtube","post"].map(t =>
    `<button class="tab" role="tab" aria-selected="${it.tab===t}" data-action="tab" data-id="${it.id}" data-tab="${t}">${l.fmt[t]}</button>`).join("");
  const rows = outlineRows(it, it.tab).map(r => `<li><span class="t">${esc(r[0])}</span><span class="b">${esc(r[1])}</span></li>`).join("");
  let actions = "";
  if(!opts.sample){
    const saved = inVault(it.id);
    actions = `<footer class="idea-actions">`+
      (opts.vault ? "" : `<button class="btn btn-ghost btn-sm" data-action="reroll" data-id="${it.id}">↻ ${l.reroll}</button>`)+
      (opts.vault ? `<button class="btn btn-ghost btn-sm" data-action="remove" data-id="${it.id}">${l.remove}</button>`
                  : `<button class="btn btn-ghost btn-sm ${saved?"saved":""}" data-action="save" data-id="${it.id}" ${saved?"disabled":""}>${saved?"✓ "+l.saved:l.save}</button>`)+
      `<button class="btn btn-ghost btn-sm" data-action="copy-idea" data-id="${it.id}">${l.copyIdea}</button></footer>`;
  }
  return `<article class="idea" lang="${it.lang}" dir="${it.lang==="ar"?"rtl":"ltr"}">
    <div class="idea-head"><span class="chip">${esc(A.name)}</span><span class="from">${l.from}: ${it.lang==="ar"?"«"+esc(it.answer)+"»":"“"+esc(it.answer)+"”"}</span></div>
    <h3 class="disp idea-title">${esc(it.title)}</h3>
    <div><div class="sec-label"><span class="tiny">${l.hooks}</span><span class="tiny">${l.hookTip}</span></div><ol class="hooks">${hooks}</ol></div>
    <div class="tabs" role="tablist">${tabs}</div>
    <ol class="outline">${rows}</ol>
    ${actions}
  </article>`;
}

function meterHTML(text){
  const l = L(), n = words(text);
  const specific = n >= 6;
  const hasNum = /[0-9٠-٩۰-۹]/.test(text);
  const oneSentence = n >= 3 && n <= 25;
  return `<span class="tiny">${l.sharp}</span>`+
    `<span class="pill ${specific?"on":""}">${l.m1}</span><span class="pill ${hasNum?"on":""}">${l.m2}</span><span class="pill ${oneSentence?"on":""}">${l.m3}</span>`;
}

  const dots = s.qs.map((_,k)=>`<i class="${k<s.i?"done":k===s.i?"on":""}"></i>`).join("");
  const last = s.i === s.qs.length-1;
  return `<div class="view"><section class="panel">
    <div class="progress"><div class="dots">${dots}</div><span class="tiny">${l.qOf.replace("{n}", localNum(s.i+1,state.lang))}</span></div>
    <span class="chip q-angle">${esc(A.name)}</span>
    <h2 class="disp q" id="q-label">${esc(questionText(id, state.lang, state.profile))}</h2>
    <p class="hint">${esc(A.hint)}</p>
    <textarea class="ruled" id="answer" aria-labelledby="q-label" placeholder="${esc(A.ph)}">${esc(s.answers[s.i])}</textarea>
    <div class="meter" id="meter">${meterHTML(s.answers[s.i])}</div>
    <p class="err" id="err">${esc(state.err)}</p>
    <div class="session-actions">
      <div class="row">${s.i>0?`<button class="btn btn-ghost" data-action="prev">${l.back}</button>`:""}<button class="btn btn-ghost" data-action="swap">↻ ${l.swap}</button></div>
      <button class="btn btn-primary" data-action="next">${last?l.finish:l.next}</button>
    </div>
  </section></div>`;
}

function viewResults(){
  const l = L();
  return `<div class="view">
    <div class="results-head"><div class="section-head"><h2 class="disp">${l.resultsTitle}</h2><p>${l.resultsSub}</p></div>
      <button class="btn btn-primary" data-action="start">${l.again}</button></div>
    ${canStartRound() ? "" : `<div class="banner"><div><b>${l.freeUsedT}</b><span>${priceHTML(l.freeUsed)}</span></div><button class="btn btn-hl" data-action="unlock">${l.navUnlock}</button></div>`}
    <div class="ideas">${state.results.map(it => cardHTML(it)).join("")}</div>

}

function viewUnlock(){
  const l = L();
  const buy = /^https:\/\//.test(CONFIG.checkoutUrl)
    ? `<a class="btn btn-primary btn-lg" href="${esc(CONFIG.checkoutUrl)}" target="_blank" rel="noopener">${priceHTML(l.buy)}</a>`
    : `<button class="btn btn-primary btn-lg" data-action="buy-missing">${priceHTML(l.buy)}</button>`;

    side = `<div class="panel unlock-side">

function viewVault(){
  const l = L();
  if(!state.vault.length){
    return `<div class="view"><div class="empty"><h2 class="disp">${l.vaultEmptyT}</h2><p>${l.vaultEmpty}</p><button class="btn btn-primary" data-action="start">${l.start}</button></div></div>`;
  }
  return `<div class="view">
    <div class="results-head"><div class="section-head"><h2 class="disp">${l.vaultTitle}</h2><p>${l.vaultSub}</p></div>
      <button class="btn btn-ghost" data-action="copy-all">${l.copyAll}</button></div>
    <div class="ideas">${state.vault.slice().reverse().map(it => cardHTML(it,{vault:true})).join("")}</div>
  </div>`;
}

function render(focus){
  const root = document.documentElement;
  root.lang = state.lang; root.dir = state.lang==="ar" ? "rtl" : "ltr";
  renderNav();
  const app = document.getElementById("app");
  const v = state.view;
  app.innerHTML = v==="profile" ? viewProfile() : v==="session" ? viewSession() : v==="results" ? viewResults() : v==="vault" ? viewVault() : v==="unlock" ? viewUnlock() : viewHome();
  if(focus){ const el = document.getElementById(focus); if(el){ el.focus(); if(el.setSelectionRange){ const n=el.value.length; el.setSelectionRange(n,n);} } }
}
function go(view, focus){ state.view = view; state.err = ""; render(focus); window.scrollTo({top:0}); }

/* ---------- session logic ---------- */
function newSession(){
  const fresh = shuffle(ANGLE_IDS.filter(id => !state.recent.includes(id)));
  const pool = fresh.concat(shuffle(ANGLE_IDS.filter(id => state.recent.includes(id))));
  state.session = {qs:pool.slice(0,3), answers:["","",""], i:0};
  go("session","answer");
}
function swapQuestion(){
  const s = state.session;
  s.seen = s.seen || s.qs.slice();
  let options = ANGLE_IDS.filter(id => !s.qs.includes(id) && !s.seen.includes(id) && !state.recent.includes(id));
  if(!options.length) options = ANGLE_IDS.filter(id => !s.qs.includes(id) && !s.seen.includes(id));
  if(!options.length){ s.seen = s.qs.slice(); options = ANGLE_IDS.filter(id => !s.qs.includes(id)); }
  const pick = shuffle(options)[0];
  s.qs[s.i] = pick; s.seen.push(pick); s.answers[s.i] = "";
  state.err = ""; render("answer");
}
function nextQuestion(){
  const s = state.session;
  if(words(s.answers[s.i]) < 2){ state.err = L().needAnswer; render("answer"); return; }
  state.err = "";
  if(s.i < s.qs.length-1){ s.i++; render("answer"); return; }
  state.results = s.qs.map((id,k) => makeIdea(id, s.answers[k], state.profile, state.lang));
  state.recent = s.qs.concat(state.recent.filter(id => !s.qs.includes(id))).slice(0,6);
  store.set("recent", state.recent);
  state.session = null;
  if(!isUnlocked()){ state.rounds = (+state.rounds || 0) + 1; store.set("rounds", state.rounds); }
  go("results");
}

/* ---------- copy + toast ---------- */
let toastTimer;
function toast(msg){
  const t = document.getElementById("toast");
  t.firstElementChild.textContent = msg; t.classList.add("show");
  clearTimeout(toastTimer); toastTimer = setTimeout(() => t.classList.remove("show"), 1800);
}
function copyText(text, lang){
  const done = () => toast(T[lang||state.lang].copied);
  const fallback = () => {
    const ta = document.createElement("textarea");
    ta.value = text; ta.setAttribute("readonly",""); ta.style.position="fixed"; ta.style.opacity="0";
    document.body.appendChild(ta); ta.select();
    try{ document.execCommand("copy"); done(); }catch(e){}
    ta.remove();
  };
  try{
    if(navigator.clipboard && navigator.clipboard.writeText) navigator.clipboard.writeText(text).then(done, fallback);
    else fallback();
  }catch(e){ fallback(); }
}

/* ---------- events ---------- */
document.addEventListener("click", e => {
  const b = e.target.closest("[data-action]"); if(!b) return;
  const a = b.dataset.action, id = b.dataset.id;
  if(a==="home") go("home");
  else if(a==="start"){ !canStartRound() ? go("unlock","f-key") : state.profile ? newSession() : go("profile","f-niche"); }
  else if(a==="unlock") go("unlock","f-key");
  else if(a==="remove-license") removeLicense();
  else if(a==="buy-missing") toast(L().buyMissing);
  else if(a==="vault") go("vault");
  else if(a==="profile") go("profile","f-niche");
  else if(a==="lang"){ state.lang = state.lang==="ar" ? "en" : "ar"; store.set("lang", state.lang); if(state.view==="session") state.view = state.profile ? "session" : "profile"; state.err=""; render(); }
  else if(a==="example"){
    const ex = EXAMPLE[state.lang];
    document.getElementById("f-niche").value = ex.niche;
    document.getElementById("f-aud").value = ex.aud;
    document.getElementById("f-res").value = ex.res;
  }
  else if(a==="swap") swapQuestion();
  else if(a==="next") nextQuestion();
  else if(a==="prev"){ state.session.i--; state.err=""; render("answer"); }
  else if(a==="tab"){ const it = findIdea(id); if(it){ it.tab = b.dataset.tab; if(inVault(id)) saveVault(); render(); } }
  else if(a==="reroll"){ const it = findIdea(id); if(it){ pickHooks(it); render(); } }
  else if(a==="save"){ const it = findIdea(id); if(it && !inVault(id)){ state.vault.push(JSON.parse(JSON.stringify(it))); saveVault(); render(); toast(T[it.lang].savedToast); } }
  else if(a==="remove"){ state.vault = state.vault.filter(x => x.id!==id); saveVault(); render(); toast(L().removed); }
  else if(a==="copy-hook"){ const it = findIdea(id); if(it) copyText(it.hooks[+b.dataset.k], it.lang); }
  else if(a==="copy-idea"){ const it = findIdea(id); if(it) copyText(ideaText(it), it.lang); }
  else if(a==="copy-all"){ copyText(state.vault.slice().reverse().map(ideaText).join("\n\n————\n\n")); }
});

document.addEventListener("input", e => {
  if(e.target.id==="answer" && state.session){
    state.session.answers[state.session.i] = e.target.value;
    document.getElementById("meter").innerHTML = meterHTML(e.target.value);
    if(state.err){ state.err=""; const er=document.getElementById("err"); if(er) er.textContent=""; }
  }
});
document.addEventListener("keydown", e => {
  if(e.target.id==="answer" && e.key==="Enter" && (e.metaKey||e.ctrlKey)){ e.preventDefault(); nextQuestion(); }
});
document.addEventListener("submit", e => {
  if(e.target.id==="unlock-form"){ e.preventDefault(); if(!state.busy) activateKey(e.target.key.value); return; }
  if(e.target.id!=="profile-form") return;
  e.preventDefault();
  const f = e.target;
  const p = {niche:f.niche.value.trim(), aud:f.aud.value.trim(), res:f.res.value.trim(), plat:(f.querySelector("input[name=plat]:checked")||{}).value || "short"};
  if(!p.niche || !p.aud || !p.res){ document.getElementById("err").textContent = L().needAll; return; }
  state.profile = p;
  canStartRound() ? newSession() : go("unlock","f-key");
});

render();
recheckLicense();
})();
</script>
