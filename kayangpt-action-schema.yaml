openapi: 3.1.0
info:
  title: Kayan Live Updates Feed
  description: Returns the current list of Kayan.ai feature updates, refreshed daily.
  version: "2.0.0"
servers:
  - url: https://raw.githubusercontent.com
paths:
  /tsamara80/kayanupdates/main/updates.json:
    get:
      operationId: getKayanUpdates
      summary: Get the latest Kayan.ai feature updates
      description: "Returns Kayan.ai feature updates as JSON, newest first. Each item has a category (LIVE_NOW or COMING_SOON), a published date, an English title and content, and an Arabic title_ar and content_ar. Answer in the user's language using the matching fields. Use LIVE_NOW items by default when asked what is new. Mention COMING_SOON items only when asked about upcoming features, never with a date."
      responses:
        "200":
          description: Successful response
          content:
            application/json:
              schema:
                type: object
                properties:
                  last_updated:
                    type: string
                  updates:
                    type: array
                    items:
                      type: object
                      properties:
                        category:
                          type: string
                        published:
                          type: string
                        title:
                          type: string
                        content:
                          type: string
                        title_ar:
                          type: string
                        content_ar:
                          type: string
